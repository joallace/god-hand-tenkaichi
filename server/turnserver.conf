# coturn config for God Hand Tenkaichi (used by docker-compose.yml, profile "turn").
# Values that differ per deployment (secret, realm, relay port range, external
# IP) are passed as command-line flags by docker-compose.yml from server/.env,
# so this file holds no secrets and needs no templating.

listening-port=3478
tls-listening-port=5349

# TURN REST credentials: the signaling server hands each client
# username "<expiry>:<label>", credential base64(HMAC-SHA1(secret, username)).
# static-auth-secret comes from GHT_TURN_SECRET (command line).
use-auth-secret

# Optional TLS for turns: (port 5349). If these files are missing coturn
# logs a warning and serves TURN without TLS. See README "TLS".
cert=/etc/coturn/certs/fullchain.pem
pkey=/etc/coturn/certs/privkey.pem
no-tlsv1
no-tlsv1_1

fingerprint
# Game traffic is UDP; never open TCP relays to arbitrary peers.
no-tcp-relay
no-multicast-peers
no-cli
no-software-attribute
stale-nonce=600

# Never relay into loopback, private, link-local, CGNAT or reserved ranges
# (keeps the relay from reaching the VPS's own private network or metadata
# service). Browsers on the same LAN connect directly and need no relay.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.88.99.0-192.88.99.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=224.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=64:ff9b::-64:ff9b::ffff:ffff
denied-peer-ip=::ffff:0.0.0.0-::ffff:255.255.255.255
denied-peer-ip=100::-100::ffff:ffff:ffff:ffff
denied-peer-ip=2001::-2001:1ff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=2002::-2002:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Abuse limits: allocations per user / whole server, bytes/s per session
# (a 4-player match is a few tens of KB/s; 0 = unlimited).
user-quota=12
total-quota=1200
max-bps=262144

# Quiet logs on stdout (docker logs).
log-file=stdout
simple-log
